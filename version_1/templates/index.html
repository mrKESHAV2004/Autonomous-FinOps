<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous FinOps Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .btn-primary { background-color: #4f46e5; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-5">
                    <h2 class="text-center mb-4">🚀 FinOps Intelligence</h2>
                    <p class="text-center text-muted mb-4">Upload your FOCUS billing CSV to detect zombies and forecast spend.</p>
                    
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-danger">{{ messages[0] }}</div>
                      {% endif %}
                    {% endwith %}

                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="file" class="form-label">Cloud Billing Data (CSV)</label>
                            <input class="form-control" type="file" id="file" name="file" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Run Analysis</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
