# Used by `alembic revision --autogenerate -m "..."` during development.
# Applying migrations: `finops-db upgrade` (reads FINOPS_DATABASE_URL).
[alembic]
script_location = src/finops_app/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
