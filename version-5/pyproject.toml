[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "autonomous-finops"
version = "0.5.0"
description = "AI-powered cloud cost optimisation: zombie resource detection and spend forecasting"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0,<4",
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.1",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    # Keras 3 / .keras model format. Moves to an [ml] extra once the
    # analysis runs in a separate worker (Phase 2).
    "tensorflow>=2.16,<2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.4",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "bandit[toml]>=1.7.9",
    "pre-commit>=3.7",
]

[project.scripts]
finops-web = "finops_app.__main__:main"
finops-train = "finops_core.training:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finops_core", "src/finops_app"]

# ---------------------------------------------------------------- tooling

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# S bandit-lite, T20 no print(), SIM simplifications
select = ["E", "W", "F", "I", "B", "UP", "S", "T20", "SIM"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fake secrets and fake /tmp paths as plain values.
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["finops_core", "finops_app"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["finops_core", "finops_app"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: trains the LSTM or runs the full pipeline (deselect with -m 'not slow')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["finops_core", "finops_app"]
branch = true

[tool.coverage.report]
show_missing = true
