name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-5:
    name: version-5 (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: version-5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finops
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: finops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finops -d finops_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Repository tests also run against PostgreSQL when this is set.
      FINOPS_TEST_POSTGRES_URL: postgresql+psycopg://finops:ci-only@localhost:5432/finops_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: version-5/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra ml --extra postgres --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src -q

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Verify Docker build
        run: docker build -t finops-app:ci .

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version-5/deploy/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Format check
        run: terraform fmt -check

      - name: Init and validate
        run: |
          terraform init -backend=false
          terraform validate

