name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-5:
    name: version-5 (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: version-5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: version-5/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src -q

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
